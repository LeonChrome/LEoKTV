name: Build and publish LEoKTV

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Install JavaScript dependencies
        run: npm ci --no-audit --fund=false
      - name: Build MDX worker sidecar
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r native/requirements-worker.txt pyinstaller
          pyinstaller --clean --noconfirm --onefile --name mdx-worker native/mdx_worker.py --paths native --hidden-import mdx_engine --collect-all soundfile --collect-all imageio_ffmpeg
          New-Item -ItemType Directory -Force src-tauri/binaries | Out-Null
          Copy-Item dist/mdx-worker.exe src-tauri/binaries/mdx-worker-x86_64-pc-windows-msvc.exe
      - name: Smoke test packaged MDX worker
        shell: pwsh
        run: |
          $smokeRoot = Join-Path $env:RUNNER_TEMP 'leoktv-mdx-smoke'
          New-Item -ItemType Directory -Force $smokeRoot | Out-Null
          $env:LEOKTV_SMOKE_ROOT = $smokeRoot
          @'
          import math, os, struct, wave
          path = os.path.join(os.environ["LEOKTV_SMOKE_ROOT"], "input.wav")
          with wave.open(path, "wb") as audio:
              audio.setnchannels(2)
              audio.setsampwidth(2)
              audio.setframerate(44100)
              for index in range(44100):
                  sample = int(12000 * math.sin(2 * math.pi * 440 * index / 44100))
                  audio.writeframes(struct.pack("<hh", sample, sample))
          '@ | Set-Content -Path smoke.py -Encoding utf8
          python smoke.py
          $request = @{ op = 'process'; root = $smokeRoot; input = (Join-Path $smokeRoot 'input.wav'); id = 'ci-smoke' } | ConvertTo-Json -Compress
          $output = & dist/mdx-worker.exe --once $request 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0) { throw "MDX worker smoke test failed: $output" }
          if ($output -notmatch '"event"\s*:\s*"complete"') { throw "MDX worker produced no complete event: $output" }
      - name: Build Windows installer
        run: npm run tauri -- build --bundles nsis
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: leoktv-windows
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  android:
    name: Android APK
    runs-on: ubuntu-22.04
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - name: Install Android build tools
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"
      - name: Install JavaScript dependencies
        run: npm ci --no-audit --fund=false
      - name: Initialize Android project
        run: npm run tauri -- android init --ci --skip-targets-install
      - name: Build debug APK
        run: npm run tauri -- android build --debug --split-per-abi --apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: leoktv-android
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

  release:
    name: Create GitHub release
    needs: [windows, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Windows installer
        uses: actions/download-artifact@v5
        with:
          name: leoktv-windows
          path: release-assets
      - name: Download Android APK
        uses: actions/download-artifact@v5
        with:
          name: leoktv-android
          path: release-assets
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: LEoKTV ${{ github.ref_name }}
          body: |
            Windows NSIS installer and Android APK for private testing.
            The Android APK is debug-signed for private sideloading.
          generate_release_notes: true
          prerelease: true
          fail_on_unmatched_files: true
          files: release-assets/**/*
